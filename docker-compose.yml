services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: recipe, POSTGRES_PASSWORD: recipe, POSTGRES_DB: recipes}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U recipe -d recipes"], interval: 5s, timeout: 5s, retries: 20}
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment: {DATABASE_URL: postgresql://recipe:recipe@postgres:5432/recipes}
    ports: ["8501:8501"]
    depends_on: {postgres: {condition: service_healthy}}
  ingest:
    build: .
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment: {DATABASE_URL: postgresql://recipe:recipe@postgres:5432/recipes}
    command: ["recipe-ingest"]
    depends_on: {postgres: {condition: service_healthy}}
  scheduler:
    build: .
    profiles: ["scheduler"]
    env_file:
      - path: .env
        required: false
    environment: {DATABASE_URL: postgresql://recipe:recipe@postgres:5432/recipes}
    command: ["python", "-m", "recipe_assistant.scheduler"]
    depends_on: {postgres: {condition: service_healthy}}
  grafana:
    image: "grafana/grafana:11.5.2"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    ports: ["3000:3000"]
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro", "grafana_data:/var/lib/grafana"]
    depends_on: {postgres: {condition: service_healthy}}
volumes: {postgres_data: {}, grafana_data: {}}
